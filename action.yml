name: Broker Auth CI Bridge
description: Exchange or reuse a Broker session and request a separate repo-read grant for each target repository.

inputs:
  broker_url:
    description: Auth Broker base URL. Must be HTTPS.
    required: true

  project:
    description: Project id configured in the Auth Broker policy for this repository.
    required: true

  broker_audience:
    description: OIDC audience expected by Auth Broker.
    required: false
    default: cfw-zhi-auth-center

  user_agent:
    description: User-Agent header sent to Auth Broker endpoints.
    required: false
    default: auth-broker-x-ci/1.0

  target_repo:
    description: Optional owner/repo targets, one per line or comma-separated. Each receives its own grant and token using the same session.
    required: false
    default: ""

  session_id:
    description: Optional existing Broker session for this project. Skips OIDC exchange when provided; the Broker validates its project and expiry.
    required: false
    default: ""

  probe_healthz:
    description: Probe /healthz before broker API calls. This is diagnostic-only and does not fail the action.
    required: false
    default: "true"

  cf_access_client_id:
    description: Optional Cloudflare Access service token Client ID.
    required: false
    default: ""

  cf_access_client_secret:
    description: Optional Cloudflare Access service token Client Secret.
    required: false
    default: ""

  setup_python:
    description: Run actions/setup-python before executing the Python sidecar.
    required: false
    default: "true"

  python_version:
    description: Python version passed to actions/setup-python. Defaults to Python 3.14.
    required: false
    default: "3.14"

outputs:
  repo_read_grants_json:
    description: JSON object keyed by owner/repo, with grant_id, repo, token, and expires_at for each target. Contains credentials; do not log it.
    value: ${{ steps.broker_auth.outputs.repo_read_grants_json }}

  session_id:
    description: Broker session id.
    value: ${{ steps.broker_auth.outputs.session_id }}

  broker_session_id:
    description: Namespaced alias of broker session id.
    value: ${{ steps.broker_auth.outputs.session_id }}

  grant_id:
    description: Repo-read grant id when exactly one target is requested; empty for zero or multiple targets.
    value: ${{ steps.broker_auth.outputs.grant_id }}

  repo_read_grant_id:
    description: Namespaced alias of repo-read grant id.
    value: ${{ steps.broker_auth.outputs.grant_id }}

  repo:
    description: Repository returned when exactly one target is requested; empty for zero or multiple targets.
    value: ${{ steps.broker_auth.outputs.repo }}

  repo_read_repo:
    description: Namespaced alias of repository returned by repo-read grant.
    value: ${{ steps.broker_auth.outputs.repo }}

  token:
    description: Temporary GitHub App token when exactly one target is requested; use repo_read_grants_json for multiple targets.
    value: ${{ steps.broker_auth.outputs.token }}

  repo_read_token:
    description: Namespaced alias of temporary GitHub App installation token.
    value: ${{ steps.broker_auth.outputs.token }}

  expires_at:
    description: Token expiration when exactly one target is requested; empty for zero or multiple targets.
    value: ${{ steps.broker_auth.outputs.expires_at }}

  repo_read_expires_at:
    description: Namespaced alias of repo-read token expiration timestamp.
    value: ${{ steps.broker_auth.outputs.expires_at }}

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python_version }}
      if: ${{ inputs.setup_python == 'true' }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python_version }}

    - name: Run Auth Broker Python sidecar
      id: broker_auth
      shell: bash
      env:
        BROKER_URL: ${{ inputs.broker_url }}
        PROJECT: ${{ inputs.project }}
        BROKER_AUDIENCE: ${{ inputs.broker_audience }}
        BROKER_USER_AGENT: ${{ inputs.user_agent }}
        TARGET_REPO: ${{ inputs.target_repo }}
        BROKER_SESSION_ID: ${{ inputs.session_id }}
        PROBE_HEALTHZ: ${{ inputs.probe_healthz }}

        CF_ACCESS_CLIENT_ID: ${{ inputs.cf_access_client_id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.cf_access_client_secret }}

        SOURCE_REPOSITORY: ${{ github.repository }}
        GIT_REF: ${{ github.ref }}
        WORKFLOW_NAME: ${{ github.workflow }}
        RUN_ID: ${{ github.run_id }}
        ACTOR: ${{ github.actor }}
        COMMIT_SHA: ${{ github.sha }}

        REQUIRED_PYTHON_PREFIX: ${{ inputs.python_version }}
      run: |
        set -euo pipefail

        if command -v python >/dev/null 2>&1; then
          PYTHON_BIN=python
        elif command -v python3.14 >/dev/null 2>&1; then
          PYTHON_BIN=python3.14
        elif command -v python3 >/dev/null 2>&1; then
          PYTHON_BIN=python3
        else
          echo "python is required to run this action" >&2
          exit 1
        fi

        "$PYTHON_BIN" -c 'import sys; print("python=" + sys.version.split()[0])'
        "$PYTHON_BIN" "${{ github.action_path }}/scripts/broker_auth.py"
